# Copy to config.toml and edit. Anything you leave out uses the default shown here.
# Secrets do not go in this file: DISCORD_TOKEN (and ANTHROPIC_API_KEY if used)
# come from the environment or a .env file.

[bot]
name = "Echo"
wake_words = ["echo"]          # words that get the bot's attention, matched as whole words
listen_mode = "wake"           # "wake" or "always" (changeable live with /mode)
require_opt_in = true          # only listen to people who ran /optin
followup_window_s = 20         # keep talking without the wake word for this long after a reply
show_transcript = true         # post what was heard and said in the text channel
data_dir = "data"
voices_dir = "voices"
dev_guild_id = 0               # your server ID here makes slash commands show up instantly

[audio]
silence_timeout_s = 0.9        # pause length that ends a sentence
min_utterance_s = 0.4          # ignore coughs and clicks shorter than this
max_utterance_s = 25
energy_threshold = 350         # raise if background noise triggers it, lower if it misses quiet speakers
barge_in_s = 0.4               # talk over the bot this long to cut it off, 0 to disable

[stt]
model = "small"                # tiny / base / small / medium / large-v3 / distil-large-v3
device = "auto"                # "auto", "cuda" or "cpu"
compute_type = "auto"
language = ""                  # "" auto-detects, or force "en", "de", ...

[llm]
# Local and private: Ollama, llama.cpp server, LM Studio, vLLM (anything OpenAI-compatible)
backend = "openai"
base_url = "http://localhost:11434/v1"
model = ""                     # REQUIRED: a model you have pulled, see `ollama list`

# Or the Claude API instead (set ANTHROPIC_API_KEY):
# backend = "anthropic"
# model = "claude-haiku-5-5"

max_tokens = 300
temperature = 0.8
history_turns = 12             # how many back-and-forths the bot remembers
persona = """You are {name}, a friendly and witty voice in a Discord voice channel. \
Several people may be talking; each message starts with the speaker's name in brackets."""

[tts]
model = "nano"                 # "nano" (CPU ok), "turbo" (GPU), "standard" (GPU, emotion control), "multilingual" (GPU, 23 languages)
device = "auto"
language = "en"                # only for "multilingual", e.g. "de"
default_voice = ""             # name of a file in voices/ without .wav, "" = built-in voice

# Starting values for /tune (each server can change its own)
speed = 1.0
pitch = 1.0
volume = 1.0
exaggeration = 0.5
cfg_weight = 0.5
temperature = 0.8
